name: Apply workspace backup feature patch

on:
  push:
    branches:
      - agent/workspace-backup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/workspace-backup
      - name: Apply feature patch
        run: |
          python - <<'PY'
          from pathlib import Path

          vault = Path('lib/local-vault.ts')
          text = vault.read_text()
          replacements = [
            ('export function loadLocalDocument() {', 'export function loadLocalDocument(documentId: string = activeDocumentId) {'),
            ('    return actualWinner.markdown;\n  });\n}\n\nexport function listLocalRecoveryDrafts()', '    return actualWinner.markdown;\n  }, documentId);\n}\n\nexport function listLocalRecoveryDrafts()'),
            ('export function saveLocalDocument(markdown: string): Promise<StorageHealth> {', 'export function saveLocalDocument(markdown: string, documentId: string = activeDocumentId): Promise<StorageHealth> {'),
            ('    return { ...health, saved: candidateSaved };\n  });\n}\n\nexport async function requestPersistentStorage()', '    return { ...health, saved: candidateSaved };\n  }, documentId);\n}\n\nexport async function requestPersistentStorage()'),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'missing vault patch anchor: {old[:100]}')
            text = text.replace(old, new, 1)
          vault.write_text(text)

          editor = Path('components/lab-editor.tsx')
          text = editor.read_text()
          replacements = [
            (
              '  inspectLocalStorage,\n  isLocalDocumentDeleted,',
              '  inspectLocalStorage,\n  loadLocalDocument,\n  isLocalDocumentDeleted,',
            ),
            (
              '  requestPersistentStorage,\n  setLocalDocumentScope,',
              '  requestPersistentStorage,\n  saveLocalDocument,\n  setLocalDocumentScope,',
            ),
            (
              'import { classifyClipboardPaste } from "@/lib/paste-normalization";',
              'import { classifyClipboardPaste } from "@/lib/paste-normalization";\nimport { buildWorkspaceBackup, parseWorkspaceBackup } from "@/lib/workspace-backup";',
            ),
            (
              '  { id: "import", label: "Import Markdown", detail: "Open a local .md file", terms: "open file load" },\n  { id: "export", label: "Export Markdown", detail: "Save a local .md copy", terms: "download file save" },\n  { id: "recover", label: "Export recovery drafts", detail: "Download conflicting local drafts", terms: "conflict restore backup" },',
              '  { id: "import", label: "Import Markdown", detail: "Open a local .md file", terms: "open file load" },\n  { id: "export", label: "Export Markdown", detail: "Save a local .md copy", terms: "download file save" },\n  { id: "backup", label: "Backup workspace", detail: "Export every local session", terms: "workspace all documents json archive" },\n  { id: "restore", label: "Restore workspace", detail: "Merge a workspace backup", terms: "workspace import json sessions" },\n  { id: "recover", label: "Export recovery drafts", detail: "Download conflicting local drafts", terms: "conflict restore backup" },',
            ),
            (
              'function recoveryBundle(drafts: readonly LocalRecoveryDraft[]) {',
              'function downloadJson(filename: string, value: unknown) {\n  const blob = new Blob([JSON.stringify(value, null, 2)], { type: "application/json;charset=utf-8" });\n  const anchor = document.createElement("a");\n  anchor.href = URL.createObjectURL(blob);\n  anchor.download = filename;\n  anchor.hidden = true;\n  document.body.append(anchor);\n  anchor.click();\n  anchor.remove();\n  globalThis.setTimeout(() => URL.revokeObjectURL(anchor.href), 0);\n}\n\nfunction recoveryBundle(drafts: readonly LocalRecoveryDraft[]) {',
            ),
            (
              '  const fileInputRef = useRef<HTMLInputElement>(null);',
              '  const fileInputRef = useRef<HTMLInputElement>(null);\n  const workspaceInputRef = useRef<HTMLInputElement>(null);',
            ),
            (
              '      if (command.id === "recover") {',
              '      if (command.id === "backup") {\n        void (async () => {\n          try {\n            if (!(await persistence.flush())) {\n              setNotice("This note could not be fully saved, so the workspace backup was cancelled.");\n              return;\n            }\n            const available = listDocumentSessions();\n            const bundle = await buildWorkspaceBackup(available, (id) => loadLocalDocument(id));\n            downloadJson("lab-workspace.json", bundle);\n            setNotice(`Backed up ${bundle.documents.length} local ${bundle.documents.length === 1 ? "session" : "sessions"}.`);\n          } catch {\n            setNotice("The local workspace could not be backed up.");\n          }\n        })();\n        return;\n      }\n      if (command.id === "restore") {\n        workspaceInputRef.current?.click();\n        return;\n      }\n      if (command.id === "recover") {',
            ),
            (
              '  const onMathEditorKeyDown = (event: React.KeyboardEvent<HTMLInputElement | HTMLTextAreaElement>) => {',
              '  const onWorkspaceRestore = (event: React.ChangeEvent<HTMLInputElement>) => {\n    const file = event.target.files?.[0];\n    if (!file) return;\n    void file.text()\n      .then(parseWorkspaceBackup)\n      .then(async (bundle) => {\n        const restored: DocumentSession[] = [];\n        try {\n          for (const document of bundle.documents) {\n            const session = await createDocumentSession(`Restored ${document.name}`);\n            restored.push(session);\n            const result = await saveLocalDocument(document.markdown, session.id);\n            if (result.saved !== true) throw new Error("A restored document could not be saved.");\n          }\n          setSessions(listDocumentSessions());\n          setNotice(`Restored ${restored.length} ${restored.length === 1 ? "session" : "sessions"} as new local documents.`);\n        } catch {\n          await Promise.all(restored.map((session) => purgeDocumentSession(session.id).catch(() => undefined)));\n          setNotice("Workspace restore failed; newly created sessions were rolled back.");\n        }\n      })\n      .catch((error: unknown) => {\n        setNotice(error instanceof Error ? error.message : "The selected workspace backup could not be read.");\n      });\n    event.target.value = "";\n  };\n\n  const onMathEditorKeyDown = (event: React.KeyboardEvent<HTMLInputElement | HTMLTextAreaElement>) => {',
            ),
            (
              '      <input ref={fileInputRef} hidden type="file" accept=".md,.markdown,text/markdown,text/plain" tabIndex={-1} aria-hidden="true" onChange={onImport} />',
              '      <input ref={fileInputRef} hidden type="file" accept=".md,.markdown,text/markdown,text/plain" tabIndex={-1} aria-hidden="true" onChange={onImport} />\n      <input ref={workspaceInputRef} data-testid="workspace-restore-input" hidden type="file" accept=".json,application/json" tabIndex={-1} aria-hidden="true" onChange={onWorkspaceRestore} />',
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'missing editor patch anchor: {old[:120]}')
            text = text.replace(old, new, 1)
          editor.write_text(text)
          PY
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-apply-workspace-backup.yml
          git add components/lab-editor.tsx lib/local-vault.ts
          git commit -m 'feat(backup): add workspace backup and restore'
          git push
