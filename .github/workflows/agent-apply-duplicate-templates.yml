name: Apply duplicate and templates feature patch

on:
  push:
    branches:
      - agent/duplicate-templates

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/duplicate-templates
      - name: Apply feature patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/lab-editor.tsx')
          text = path.read_text()
          replacements = [
            (
              'import { classifyClipboardPaste } from "@/lib/paste-normalization";',
              'import { classifyClipboardPaste } from "@/lib/paste-normalization";\nimport { clearSessionSeed, readSessionSeed, stageSessionSeed } from "@/lib/session-seeds";',
            ),
            (
              'type PaletteMode = "commands" | "status" | "confirm-clear" | "confirm-delete" | "name" | "sessions";',
              'type PaletteMode = "commands" | "status" | "confirm-clear" | "confirm-delete" | "name" | "sessions" | "templates";',
            ),
            (
              'type MathKind = "inline" | "block";',
              'type NoteTemplate = { id: string; name: string; detail: string; markdown: string };\n\nconst NOTE_TEMPLATES: NoteTemplate[] = [\n  { id: "daily", name: "Daily note", detail: "Focus, tasks, and notes", markdown: "# Daily note\\n\\n## Focus\\n\\n- [ ] \\n\\n## Notes\\n\\n" },\n  { id: "meeting", name: "Meeting note", detail: "Agenda, decisions, and actions", markdown: "# Meeting\\n\\n## Agenda\\n\\n- \\n\\n## Decisions\\n\\n- \\n\\n## Actions\\n\\n- [ ] \\n" },\n  { id: "experiment", name: "Experiment log", detail: "Hypothesis, method, and result", markdown: "# Experiment\\n\\n## Hypothesis\\n\\n\\n## Method\\n\\n\\n## Result\\n\\n" },\n];\n\ntype MathKind = "inline" | "block";',
            ),
            (
              '  { id: "new", label: "New session", detail: "Start a separate document", terms: "document note create" },\n  { id: "name", label: "Name session", detail: "Rename this document", terms: "document note title rename" },',
              '  { id: "new", label: "New session", detail: "Start a separate document", terms: "document note create" },\n  { id: "duplicate", label: "Duplicate session", detail: "Copy this note into a new session", terms: "copy clone document note" },\n  { id: "template", label: "New from template", detail: "Start from a local note template", terms: "daily meeting experiment starter" },\n  { id: "name", label: "Name session", detail: "Rename this document", terms: "document note title rename" },',
            ),
            (
              '        if (nextHealth.saved === true) void touchDocumentSession(documentId).catch(() => undefined);',
              '        if (nextHealth.saved === true) {\n          clearSessionSeed(documentId);\n          void touchDocumentSession(documentId).catch(() => undefined);\n        }',
            ),
            (
              '  const submitSessionName = useCallback(() => {',
              '  const createSeededSession = useCallback(async (name: string, markdown: string) => {\n    const flushResult = await flushBeforeSessionSwitch();\n    if (flushResult === "cancel") return false;\n    if (!(await freezePersistenceForNavigation(flushResult === "dirty"))) return false;\n    let created: DocumentSession | null = null;\n    try {\n      created = await createDocumentSession(name);\n      if (!stageSessionSeed(created.id, markdown)) {\n        await purgeDocumentSession(created.id).catch(() => undefined);\n        throw new Error("Session seed storage is unavailable.");\n      }\n      navigateToSession(created);\n      return true;\n    } catch {\n      setNotice("The new session could not be prepared locally. Reloading…");\n      window.location.reload();\n      return false;\n    }\n  }, [flushBeforeSessionSwitch, freezePersistenceForNavigation, navigateToSession]);\n\n  const submitSessionName = useCallback(() => {',
            ),
            (
              '      if (command.id === "name") {',
              '      if (command.id === "duplicate") {\n        const markdown = editor.getMarkdown();\n        const copyName = savedSessionName === "Untitled" ? "Untitled copy" : `${savedSessionName} copy`;\n        void createSeededSession(copyName, markdown);\n        return;\n      }\n      if (command.id === "template") {\n        setSelected(0);\n        setPalette({ ...anchor, query: "", range: { from: editor.state.selection.from, to: editor.state.selection.from }, mode: "templates" });\n        return;\n      }\n      if (command.id === "name") {',
            ),
            (
              '    [documentId, editor, flushBeforeSessionSwitch, freezePersistenceForNavigation, navigateToSession, openMathEditor, persistence, savedSessionName, setPalette, setSelected],',
              '    [createSeededSession, documentId, editor, flushBeforeSessionSwitch, freezePersistenceForNavigation, navigateToSession, openMathEditor, persistence, savedSessionName, setPalette, setSelected],',
            ),
            (
              '        const markdown = await persistence.hydrate();',
              '        const markdown = await persistence.hydrate();\n        const seed = markdown ? null : readSessionSeed(documentId);\n        const initialMarkdown = seed ?? markdown;',
            ),
            (
              '        editor.commands.setContent(markdown, { contentType: "markdown", emitUpdate: false });\n        persistence.markLoaded(markdown);',
              '        editor.commands.setContent(initialMarkdown, { contentType: "markdown", emitUpdate: false });\n        persistence.markLoaded(initialMarkdown);\n        if (seed !== null) persistence.onEdit(initialMarkdown);',
            ),
            (
              '    if (current.mode === "sessions") {',
              '    if (current.mode === "templates") {\n      if (event.key === "ArrowDown" || event.key === "ArrowUp") {\n        event.preventDefault();\n        const direction = event.key === "ArrowDown" ? 1 : -1;\n        const count = NOTE_TEMPLATES.length;\n        setSelected((selectedRef.current + direction + count) % count);\n      } else if ((event.key === "Enter" || event.key === "Tab") && NOTE_TEMPLATES.length > 0) {\n        event.preventDefault();\n        const template = NOTE_TEMPLATES[selectedRef.current] ?? NOTE_TEMPLATES[0];\n        setPalette(null);\n        void createSeededSession(template.name, template.markdown);\n      }\n      return;\n    }\n\n    if (current.mode === "sessions") {',
            ),
            (
              '            role={palette.mode === "commands" || palette.mode === "sessions" ? "listbox" : palette.mode === "name" ? "dialog" : "status"}\n            aria-label={palette.mode === "sessions" ? "Document sessions" : "Slash commands"}',
              '            role={palette.mode === "commands" || palette.mode === "sessions" || palette.mode === "templates" ? "listbox" : palette.mode === "name" ? "dialog" : "status"}\n            aria-label={palette.mode === "sessions" ? "Document sessions" : palette.mode === "templates" ? "Note templates" : "Slash commands"}',
            ),
            (
              '          ) : palette.mode === "confirm-clear" ? (',
              '          ) : palette.mode === "templates" ? (\n            <div className="command-list session-list" data-testid="template-list">\n              {NOTE_TEMPLATES.map((template, index) => (\n                <div\n                  className="command-item"\n                  data-selected={index === selected}\n                  id={`${PALETTE_ID}-template-${template.id}`}\n                  key={template.id}\n                  role="option"\n                  aria-selected={index === selected}\n                  onMouseDown={(event) => {\n                    event.preventDefault();\n                    setPalette(null);\n                    void createSeededSession(template.name, template.markdown);\n                  }}\n                  onMouseEnter={() => setSelected(index)}\n                >\n                  <span>{template.name}</span>\n                  <small>{template.detail}</small>\n                </div>\n              ))}\n            </div>\n          ) : palette.mode === "confirm-clear" ? (',
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'missing patch anchor: {old[:120]}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-apply-duplicate-templates.yml
          git add components/lab-editor.tsx
          git commit -m 'feat(editor): add duplicate and templates'
          git push
