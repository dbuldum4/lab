[package]
name = "lab-desktop"
version = "0.1.0"
edition = "2024"
description = "lab: a local-first Markdown notepad, native on macOS and Linux"
publish = false
default-run = "lab"

[[bin]]
name = "lab"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["x11", "wayland", "runtime_shaders"] }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
